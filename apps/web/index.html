<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1F6338" />
    <meta
      name="description"
      content="Projet AVENIR (Rikolto RDC) — Planifiez votre champ. Calculez votre gain. Simulateur économique agricole et boîte à outils pédagogique (Kwilu & Kwango)."
    />
    <title>AVENIR • Planifiez votre champ. Calculez votre gain | Rikolto RDC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #faf8f3;
        color: #18221b;
        -webkit-tap-highlight-color: transparent;
      }
      img,
      svg {
        max-width: 100%;
      }
      input,
      select,
      button,
      textarea {
        font-family: inherit;
      }
      .avenir-hero-gradient {
        background: linear-gradient(180deg, #deefe0 0%, #eef5ec 55%, #faf8f3 100%);
      }
      .avenir-input-select {
        appearance: none;
        width: 100%;
        height: 44px;
        background-color: #ffffff;
        border: 1px solid #d6dad5;
        border-radius: 8px;
        padding: 0 34px 0 12px;
        font-size: 14px;
        font-weight: 600;
        color: #18221b;
        cursor: pointer;
        background-image: linear-gradient(45deg, transparent 50%, #4a554e 50%),
          linear-gradient(135deg, #4a554e 50%, transparent 50%);
        background-position: calc(100% - 16px) calc(1.15em),
          calc(100% - 11px) calc(1.15em);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }
      .avenir-input-select:focus {
        outline: 2px solid #1f6338;
        border-color: #1f6338;
      }

      /* Responsive Header & Navigation */
      .avenir-desktop-nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .avenir-mobile-menu-btn {
        display: none;
      }
      .avenir-mobile-drawer {
        display: none;
      }

      /* Responsive Grids & Sections */
      .avenir-steps-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 26px;
        width: 100%;
        margin: 0 auto;
      }
      .avenir-sim-home-grid {
        display: grid;
        grid-template-columns: minmax(300px, 490px) 1fr;
        gap: 48px;
        align-items: start;
      }
      .avenir-cards-grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 275px), 1fr));
        gap: 26px;
        width: 100%;
        margin: 0 auto;
      }
      .avenir-cards-grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
        gap: 24px;
        width: 100%;
        margin: 0 auto;
      }
      .avenir-cadre-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
        gap: 20px;
        width: 100%;
      }
      .avenir-kpi-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
        gap: 16px;
      }

      /* Expense Row Styles */
      .avenir-expense-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .avenir-expense-title {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1.6 1 230px;
        min-width: 0;
        max-width: 100%;
      }
      .avenir-expense-stepper {
        flex: 1 1 155px;
        min-width: 0;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .avenir-expense-total {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex: 0 0 auto;
        min-width: 120px;
      }

      /* Results Page Responsive Actions */
      .avenir-results-bottom-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      /* Toolbox Responsive Navigation */
      .avenir-toolbox-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .avenir-toolbox-nav-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avenir-toolbox-nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .avenir-toolbox-next-full {
        display: inline;
      }
      .avenir-toolbox-next-short {
        display: none;
      }
      .avenir-toolbox-tab-full {
        display: inline;
      }
      .avenir-toolbox-tab-short {
        display: none;
      }

      /* Admin Panel Layout */
      @media (min-width: 921px) {
        .avenir-admin-sidebar-responsive {
          transform: translateX(0) !important;
        }
        .avenir-admin-main-pane {
          margin-left: 280px !important;
        }
        .avenir-admin-mobile-toggle {
          display: none !important;
        }
      }

      @media (max-width: 920px) {
        .avenir-admin-main-pane {
          margin-left: 0 !important;
          width: 100% !important;
        }
        .avenir-admin-mobile-toggle {
          display: inline-flex !important;
        }
      }

      @media (max-width: 1080px) {
        .avenir-steps-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 62px 22px;
        }
      }

      @media (max-width: 920px) {
        .avenir-desktop-nav {
          display: none !important;
        }
        .avenir-mobile-menu-btn {
          display: inline-flex !important;
        }
        .avenir-mobile-drawer {
          display: flex;
          flex-direction: column;
          gap: 6px;
          padding-top: 12px;
          margin-top: 12px;
          border-top: 1px solid #eae6dd;
        }
        .avenir-sim-home-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .avenir-sim-home-right {
          padding-bottom: 24px !important;
        }
        .avenir-sim-umber-banner {
          margin-top: 8px !important;
          width: 100% !important;
          padding: 26px 22px !important;
        }
        .avenir-sim-umber-item {
          border-right: none !important;
          padding-right: 0 !important;
          border-bottom: 1px dashed rgba(255, 255, 255, 0.18);
          padding-bottom: 18px;
        }
        .avenir-sim-umber-item:last-child {
          border-bottom: none !important;
          padding-bottom: 0 !important;
        }
      }

      @media (max-width: 768px) {
        .avenir-expense-title {
          flex: 1 1 100% !important;
          width: 100% !important;
        }
        .avenir-expense-stepper {
          flex: 1 1 calc(50% - 6px) !important;
          min-width: 0 !important;
        }
        .avenir-expense-total {
          flex: 1 1 100% !important;
          width: 100% !important;
          justify-content: space-between !important;
          padding-top: 8px;
          margin-top: 2px;
          border-top: 1px dashed #e2e8e2;
        }
        .avenir-results-bottom-actions {
          flex-direction: column !important;
          width: 100% !important;
        }
        .avenir-results-bottom-actions button,
        .avenir-results-bottom-actions .tamagui-button,
        .avenir-results-bottom-actions > * {
          width: 100% !important;
        }

        /* Toolbox Navigation & Actions on Mobile */
        .avenir-toolbox-nav {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 10px !important;
          width: 100% !important;
        }
        .avenir-toolbox-nav-left {
          width: 100% !important;
        }
        .avenir-toolbox-nav-left button,
        .avenir-toolbox-nav-left .tamagui-button,
        .avenir-toolbox-nav-left > * {
          width: 100% !important;
          justify-content: center !important;
        }
        .avenir-toolbox-nav-right {
          width: 100% !important;
          display: grid !important;
          grid-template-columns: 1fr 1fr !important;
          gap: 8px !important;
        }
        .avenir-toolbox-nav-right > button,
        .avenir-toolbox-nav-right > .tamagui-button,
        .avenir-toolbox-nav-right > * {
          width: 100% !important;
          justify-content: center !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
        }
        .avenir-toolbox-sim-btn {
          grid-column: span 2 !important;
          width: 100% !important;
        }
        .avenir-toolbox-paging-single {
          grid-column: span 2 !important;
          width: 100% !important;
        }
        .avenir-toolbox-next-full {
          display: none !important;
        }
        .avenir-toolbox-next-short {
          display: inline !important;
        }
        .avenir-toolbox-tab-full {
          display: none !important;
        }
        .avenir-toolbox-tab-short {
          display: inline !important;
        }
      }

      @media (max-width: 680px) {
        .avenir-hero-section {
          min-height: auto !important;
          padding-top: 44px !important;
          padding-bottom: 76px !important;
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
        .avenir-hero-grid {
          gap: 32px !important;
        }
        .avenir-hero-left,
        .avenir-hero-right {
          flex: 1 1 100% !important;
          min-width: 0 !important;
          max-width: 100% !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
        }
        .avenir-hero-photo {
          height: 300px !important;
        }
        .avenir-hero-inset-photo {
          width: 125px !important;
          height: 92px !important;
          right: 6px !important;
          top: -8px !important;
        }
        .avenir-hero-float-card {
          position: relative !important;
          left: auto !important;
          bottom: auto !important;
          margin-top: -28px !important;
          margin-left: 10px !important;
          margin-right: 10px !important;
          min-width: 0 !important;
          width: calc(100% - 20px) !important;
        }
        .avenir-steps-grid {
          grid-template-columns: 1fr;
          gap: 60px 16px;
        }
        .avenir-sim-home-photo {
          height: 330px !important;
        }
        .avenir-header-cta-btn {
          display: none !important;
        }
      }

      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background-color: #ffffff !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
